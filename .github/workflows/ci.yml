name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: 0.9.26

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uv-cache
          key: ${{ runner.os }}-python-${{ hashFiles('.python-version') }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ hashFiles('.python-version') }}-uv-
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run lint and type checks
        run: uv run nox -s lint

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARIONETTE_TOKEN: test-token
      DATABASE_URL: postgresql+psycopg://marionette:pass@localhost:5432/roleplay
      REDIS_URL: redis://localhost:6379/0
      MAIN_GUILD_ID: "1234567890123456789"
      NEWS_CHANNEL_ID: "1234567890123456789"
      TABLOID_CHANNEL_ID: "1234567890123456789"
      REGISTRATION_CHANNEL_ID: "1234567890123456789"
      ONBOARDING_WELCOME_CHANNEL_ID: "1234567890123456789"
      ONBOARDING_INTRO_CHANNEL_ID: "1234567890123456789"
      ONBOARDING_RULES_CHANNEL_ID: "1234567890123456789"
      ONBOARDING_FAQ_CHANNEL_ID: "1234567890123456789"
      UNVERIFIED_ROLE_ID: "1234567890123456789"
      START_ROLE_ID: "1234567890123456789"
      UNREGISTERED_ROLE_ID: "1234567890123456789"
      TEXT_ROLE_ID: "1234567890123456789"
      MODERATION_CHANNEL_ID: "1234567890123456789"
      RP_CATEGORIES: "[1234567890123456789]"
      MODERATOR_ROLE_ID: "1234567890123456789"
      AMPLUA_ROLE_ID: "1234567890123456789"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .uv-cache
          key: ${{ runner.os }}-python-${{ hashFiles('.python-version') }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ hashFiles('.python-version') }}-uv-
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=marionette --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILDKIT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build application image
        run: docker build --pull --tag marionette:${{ github.sha }} .
